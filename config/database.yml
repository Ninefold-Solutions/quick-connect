development:
  adapter: sqlite3
  database: db/development.sqlite3
  pool: 3

test:
  adapter: sqlite3
  database: db/test.sqlite3
  pool: 3

production:
  adapter: sqlite3
  database: <%= ENV.fetch("SQLITE_DATABASE_PATH", "/data/production.sqlite3") %>
  pool: <%= Integer(ENV.fetch("DB_POOL", ENV.fetch("RAILS_MAX_THREADS", 1))) %>
