services:
  - type: web
    name: quick-connect
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bin/rails db:prepare && bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MAX_THREADS
        value: "1"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: DB_POOL
        value: "1"
      - key: SOLID_QUEUE_IN_PUMA
        value: "false"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: RAILS_MASTER_KEY
        sync: false # Set this manually in Render dashboard
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
